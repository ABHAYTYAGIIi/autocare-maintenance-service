apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autocare-maintenance-service
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autocare-maintenance-service
  minReplicas: 1
  maxReplicas: 7
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
