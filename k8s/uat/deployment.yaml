apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocare-maintenance-service
  namespace: uat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autocare-maintenance-service
  template:
    metadata:
      labels:
        app: autocare-maintenance-service
    spec: 
      containers:
        - name: maintenance-service
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
